<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>3Estrellas — Administración</title>

<style>
:root{
  --bg:#0d0b10;
  --card:#17131c;
  --text:#f5f3f7;
  --muted:#aaa2b2;
  --accent:#8b5cf6;
  --line:#2a2330;
  --danger:#ef4444;
  --ok:#22c55e
}

*{box-sizing:border-box}

body{
  margin:0;
  background:var(--bg);
  color:var(--text);
  font-family:Arial,Helvetica,sans-serif
}

header{
  padding:20px 16px;
  border-bottom:1px solid var(--line);
  position:sticky;
  top:0;
  background:rgba(13,11,16,.96);
  backdrop-filter:blur(12px);
  z-index:5
}

.logo{
  font-weight:900;
  font-size:25px
}

.tag{
  font-size:12px;
  color:var(--muted);
  margin-top:3px
}

main{
  max-width:1000px;
  margin:auto;
  padding:20px 16px 70px
}

.card{
  background:var(--card);
  border:1px solid var(--line);
  border-radius:16px;
  padding:16px;
  margin-bottom:16px
}

h1{
  font-size:28px;
  margin:0 0 5px
}

h2{
  font-size:18px;
  margin:0 0 15px
}

label{
  display:block;
  font-size:12px;
  color:var(--muted);
  margin:12px 0 6px
}

input,select{
  width:100%;
  padding:12px;
  border-radius:10px;
  border:1px solid var(--line);
  background:#100e14;
  color:var(--text);
  font:inherit
}

button{
  border:1px solid var(--line);
  background:#151219;
  color:var(--text);
  border-radius:10px;
  padding:11px 14px;
  cursor:pointer;
  font-weight:700
}

.primary{
  background:var(--accent);
  border-color:var(--accent)
}

.danger{
  background:#351318;
  border-color:#6b1d26;
  color:#fecaca
}

.muted{
  color:var(--muted);
  font-size:13px
}

.row{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:12px
}

@media(max-width:650px){
  .row{
    grid-template-columns:1fr
  }
}

.actions{
  display:flex;
  gap:8px;
  flex-wrap:wrap;
  margin-top:15px
}

.hidden{
  display:none!important
}

.status{
  padding:10px 12px;
  border-radius:10px;
  background:#211d27;
  font-size:13px;
  margin-top:10px
}

.status.ok{
  color:#bbf7d0
}

.status.error{
  color:#fecaca
}

.product{
  display:grid;
  grid-template-columns:72px 1fr auto;
  gap:12px;
  align-items:center;
  padding:11px 0;
  border-bottom:1px solid var(--line)
}

.product:last-child{
  border-bottom:0
}

.thumb{
  width:72px;
  height:88px;
  border-radius:8px;
  background:#24202a;
  overflow:hidden;
  display:flex;
  align-items:center;
  justify-content:center;
  color:#777;
  font-size:10px;
  text-align:center
}

.thumb img{
  width:100%;
  height:100%;
  object-fit:cover
}

.pname{
  font-weight:800
}

.meta{
  font-size:12px;
  color:var(--muted);
  margin-top:4px
}

.stock{
  font-size:12px;
  margin-top:5px
}

.in{
  color:#86efac
}

.out{
  color:#fca5a5
}

.topbar{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:10px;
  flex-wrap:wrap
}

.note{
  font-size:12px;
  color:var(--muted);
  line-height:1.5
}

.urlbox{
  display:flex;
  gap:8px
}

.urlbox input{
  flex:1
}

.copy{
  white-space:nowrap
}
</style>
</head>

<body>

<header>
  <div class="logo">3ESTRELLAS</div>
  <div class="tag">PANEL DE ADMINISTRACIÓN</div>
</header>

<main>

<section id="loginCard" class="card">

  <h1>Ingresar</h1>

  <p class="muted">
    Usá el correo y contraseña del usuario administrador de Supabase.
  </p>

  <label>Correo</label>
  <input
    id="email"
    type="email"
    autocomplete="email"
    placeholder="tu@email.com"
  >

  <label>Contraseña</label>
  <input
    id="password"
    type="password"
    autocomplete="current-password"
    placeholder="••••••••"
  >

  <div class="actions">
    <button class="primary" id="loginBtn">
      Ingresar
    </button>
  </div>

  <div id="loginStatus" class="status hidden"></div>

</section>


<section id="panel" class="hidden">

  <div class="card">

    <div class="topbar">

      <div>
        <h1>Productos</h1>
        <div class="muted" id="count">
          Cargando…
        </div>
      </div>

      <button id="logoutBtn">
        Cerrar sesión
      </button>

    </div>

  </div>


  <section class="card">

    <h2 id="formTitle">
      Agregar producto
    </h2>

    <input
      id="productId"
      type="hidden"
    >


    <div class="row">

      <div>

        <label>Nombre</label>

        <input
          id="name"
          placeholder="Ej. Boxy Vision"
        >

      </div>


      <div>

        <label>Categoría</label>

        <input
          id="category"
          placeholder="Ej. Remeras Boxy"
        >

      </div>

    </div>


    <div class="row">

      <div>

        <label>Cuotas</label>

        <input
          id="installments"
          placeholder="3 Cuotas de $7,900"
        >

      </div>


      <div>

        <label>Precio transferencia</label>

        <input
          id="transferPrice"
          placeholder="$18,900"
        >

      </div>

    </div>


    <div class="row">

      <div>

        <label>Talle</label>

        <input
          id="size"
          placeholder="M / L / XL"
        >

      </div>


      <div>

        <label>URL de la foto (Postimages)</label>

        <input
          id="imageUrl"
          type="url"
          placeholder="https://i.postimg.cc/.../foto.jpg"
        >

      </div>

    </div>


    <label>

      <input
        id="stock"
        type="checkbox"
        checked
        style="width:auto;margin-right:8px"
      >

      Disponible / hay stock

    </label>


    <div class="actions">

      <button
        class="primary"
        id="saveBtn"
      >
        Guardar producto
      </button>

      <button
        id="cancelBtn"
        class="hidden"
      >
        Cancelar edición
      </button>

    </div>


    <div
      id="saveStatus"
      class="status hidden"
    ></div>


    <p class="note">
      Pegá la URL directa de Postimages.
      La imagen queda alojada fuera de Supabase
      y Supabase solo guarda el enlace.
    </p>

  </section>


  <section class="card">

    <h2>
      Catálogo actual
    </h2>

    <div id="list"></div>

  </section>

</section>

</main>


<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>


<script>

const SUPABASE_URL =
  "https://pwiakszymoicfqxvkchm.supabase.co";

const SUPABASE_KEY =
  "sb_publishable_i0xPBsdCEkHpyNSrPlpTDw_Ku6wrXU5";

const sb =
  supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );


const $ =
  id => document.getElementById(id);


let products = [];


function status(el,msg,ok=false){

  el.textContent = msg;

  el.className =
    "status " +
    (ok ? "ok" : "error");

}


function clearStatus(el){

  el.textContent = "";

  el.className =
    "status hidden";

}


async function load(){

  const {
    data,
    error
  } =
  await sb
    .from("products")
    .select("*")
    .order(
      "created_at",
      {
        ascending:true
      }
    );

  if(error)
    throw error;

  products =
    data || [];

  renderList();

}


function renderList(){

  $("count").textContent =
    `${products.length} productos`;


  $("list").innerHTML =

    products
      .map(p => `

        <div class="product">

          <div class="thumb">

            ${
              p.image

              ? `<img src="${esc(p.image)}">`

              : "Sin foto"
            }

          </div>


          <div>

            <div class="pname">
              ${esc(p.name)}
            </div>

            <div class="meta">

              ${esc(p.category)}
              ·
              ${esc(p.transfer_price || "")}
              ·
              Talle
              ${esc(p.size || "")}

            </div>


            <div
              class="stock ${p.stock ? "in" : "out"}"
            >

              ${
                p.stock
                ? "● Disponible"
                : "● Sin stock"
              }

            </div>

          </div>


          <div class="actions">

            <button
              onclick="editProduct(${p.id})"
            >
              Editar
            </button>


            <button
              class="danger"
              onclick="deleteProduct(${p.id})"
            >
              Eliminar
            </button>

          </div>

        </div>

      `)
      .join("")

      ||

      '<div class="muted">No hay productos.</div>';

}


function esc(v){

  return String(v ?? "")
    .replace(
      /[&<>"']/g,
      c => ({
        "&":"&amp;",
        "<":"&lt;",
        ">":"&gt;",
        '"':"&quot;",
        "'":"&#39;"
      }[c])
    );

}


function reset(){

  [
    "productId",
    "name",
    "category",
    "installments",
    "transferPrice",
    "size",
    "imageUrl"
  ]
  .forEach(
    id => $(id).value = ""
  );


  $("stock").checked = true;


  $("formTitle").textContent =
    "Agregar producto";


  $("saveBtn").textContent =
    "Guardar producto";


  $("cancelBtn")
    .classList
    .add("hidden");


  clearStatus(
    $("saveStatus")
  );

}


window.editProduct = id => {

  const p =
    products.find(
      x => x.id == id
    );

  if(!p)
    return;


  $("productId").value =
    p.id;


  $("name").value =
    p.name || "";


  $("category").value =
    p.category || "";


  $("installments").value =
    p.installments || "";


  $("transferPrice").value =
    p.transfer_price || "";


  $("size").value =
    p.size || "";


  $("imageUrl").value =
    p.image || "";


  $("stock").checked =
    !!p.stock;


  $("formTitle").textContent =
    "Editar producto";


  $("saveBtn").textContent =
    "Guardar cambios";


  $("cancelBtn")
    .classList
    .remove("hidden");


  window.scrollTo({
    top:0,
    behavior:"smooth"
  });

};


window.deleteProduct =
async id => {

  const p =
    products.find(
      x => x.id == id
    );


  if(
    !p ||
    !confirm(
      `¿Eliminar “${p.name}”?`
    )
  )
    return;


  const {
    error
  } =
  await sb
    .from("products")
    .delete()
    .eq("id",id);


  if(error){

    alert(
      error.message
    );

    return;

  }


  await load();

};


$("loginBtn").onclick =
async () => {

  clearStatus(
    $("loginStatus")
  );


  const {
    error
  } =
  await sb.auth.signInWithPassword({

    email:
      $("email")
        .value
        .trim(),

    password:
      $("password")
        .value

  });


  if(error){

    status(
      $("loginStatus"),
      error.message
    );

    return;

  }


  await init();

};


$("logoutBtn").onclick =
async () => {

  await sb.auth.signOut();

  location.reload();

};


$("cancelBtn").onclick =
reset;


$("saveBtn").onclick =
async () => {

  clearStatus(
    $("saveStatus")
  );


  const id =
    $("productId").value;


  const payload = {

    name:
      $("name")
        .value
        .trim(),

    category:
      $("category")
        .value
        .trim(),

    installments:
      $("installments")
        .value
        .trim(),

    transfer_price:
      $("transferPrice")
        .value
        .trim(),

    size:
      $("size")
        .value
        .trim(),

    stock:
      $("stock").checked

  };


  const imageUrl =
    $("imageUrl")
      .value
      .trim();


  if(
    !payload.name ||
    !payload.category
  ){

    status(
      $("saveStatus"),
      "Completá nombre y categoría."
    );

    return;

  }


  if(imageUrl){

    payload.image =
      imageUrl;

  }

  else if(id){

    const current =
      products.find(
        x => x.id == id
      );

    if(current){

      payload.image =
        current.image || "";

    }

  }


  try{

    const result =

      id

      ?

      await sb
        .from("products")
        .update(payload)
        .eq("id",id)

      :

      await sb
        .from("products")
        .insert(payload);


    if(result.error)
      throw result.error;


    status(
      $("saveStatus"),
      id
        ? "Producto actualizado."
        : "Producto agregado.",
      true
    );


    reset();

    await load();


  }

  catch(e){

    status(
      $("saveStatus"),
      e.message || String(e)
    );

  }

};


async function init(){

  const {
    data:{
      session
    }
  } =
  await sb.auth.getSession();


  if(!session){

    $("loginCard")
      .classList
      .remove("hidden");

    $("panel")
      .classList
      .add("hidden");

    return;

  }


  $("loginCard")
    .classList
    .add("hidden");


  $("panel")
    .classList
    .remove("hidden");


  try{

    await load();

  }

  catch(e){

    status(
      $("saveStatus"),
      "No tenés permisos de administrador o hay un problema con Supabase: "
      + e.message
    );

  }

}


sb.auth.onAuthStateChange(
  () => init()
);


init();

</script>

</body>
 </html>
