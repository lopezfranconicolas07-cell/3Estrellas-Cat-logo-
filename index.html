<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#09090b">
<title>3Estrellas — Streetwear & Cultura Urbana</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Permanent+Marker&family=Rubik+Spray+Paint&display=swap" rel="stylesheet">
<style>
:root{--bg:#050509;--card:#101018;--text:#f7f7ff;--muted:#b7b7cc;--accent:#254bff;--line:#20243b}
*{box-sizing:border-box}
body{margin:0;background:radial-gradient(ellipse at 15% 10%,rgba(139,92,246,.13),transparent 35%),radial-gradient(ellipse at 90% 35%,rgba(255,255,255,.035),transparent 30%),var(--bg);color:var(--text);font-family:Arial,Helvetica,sans-serif}
header{padding:19px 18px 14px;position:sticky;top:0;background:rgba(9,9,11,.95);backdrop-filter:blur(12px);z-index:5;border-bottom:1px solid var(--line)}
.logo{display:block;width:min(310px,82vw);margin:0 auto 4px}
.logo img{display:block;width:100%;height:auto;max-height:86px;object-fit:contain}
.tag{color:#91a4ff;font-size:10px;margin-top:5px;letter-spacing:3px;text-transform:uppercase;font-weight:800}
nav{display:flex;gap:8px;overflow:auto;margin-top:17px;padding-bottom:3px;scrollbar-width:thin}
button{border:1px solid var(--line);background:#151219;color:var(--text);border-radius:4px;padding:10px 13px;white-space:nowrap;cursor:pointer;font-weight:800}
button.active{background:#254bff;color:#fff;border-color:#254bff}
main{max-width:1100px;margin:auto;padding:16px 16px 90px}
.search-wrap{max-width:1100px;margin:0 auto;padding:0 16px}
.search-wrap input{width:100%;padding:13px 15px;border-radius:4px;border:1px solid var(--line);background:var(--card);color:var(--text);font:inherit}
.hero{padding:23px 0 20px}
.hero h1{font-size:clamp(30px,7vw,54px);line-height:.95;margin:0 0 12px;letter-spacing:-2px;text-transform:uppercase}
.hero p{color:var(--muted);max-width:560px;line-height:1.55;font-size:14px}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.product{background:var(--card);border:1px solid var(--line);border-radius:5px;overflow:hidden}
.photo{aspect-ratio:4/5;background:linear-gradient(135deg,#24202a,#0f0d12);display:flex;align-items:center;justify-content:center;color:#716a78;font-size:12px;text-align:center;padding:15px}
.photo img{width:100%;height:100%;object-fit:cover}
.info{padding:13px}
.cat{font-size:10px;text-transform:uppercase;color:#91a4ff;letter-spacing:1px}
.name{font-weight:800;margin:6px 0}
.price{font-size:17px;font-weight:900}
.stock{font-size:11px;color:#86efac;margin:6px 0 11px}
.buy{width:100%;border-radius:4px;background:var(--accent);border:0;padding:12px;font-weight:900;color:#fff;cursor:pointer;text-transform:uppercase;letter-spacing:.4px;font-size:11px}
.empty{grid-column:1/-1;padding:40px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:5px}
.transfer{font-size:14px;margin-top:4px}
.transfer small{font-size:11px;color:var(--muted);font-weight:400}
.size{font-size:12px;color:var(--muted);margin-top:7px}
.stock.unavailable{color:#fca5a5}
footer{text-align:center;color:var(--muted);font-size:12px;padding:30px 15px;border-top:1px solid var(--line)}
@media(min-width:750px){.grid{grid-template-columns:repeat(3,1fr)}.hero{padding-top:30px}}
</style>
</head>
<body>

<header>
  <div class="logo">
    <img src="logo.webp" alt="3Estrellas">
  </div>
  <div class="tag">Underground · Streetwear</div>
  <nav id="filters" aria-label="Categorías"></nav>
</header>

<div class="search-wrap">
  <input id="search" type="search" placeholder="Buscar prendas..." aria-label="Buscar productos">
</div>

<main>
  <section class="hero">
    <h1>Encontrá tu<br>próximo outfit.</h1>
    <p>Prendas con identidad. Explorá el catálogo, armá tu carrito y coordiná tu pedido directamente con 3Estrellas.</p>
  </section>
  <section class="grid" id="catalog" aria-live="polite"></section>
</main>

<footer>3Estrellas · La Paz, Mendoza · Catálogo online</footer>

<script>
const WHATSAPP = "5492634250010";
const SUPABASE_URL = "https://pwiakszymoicfqxvkchm.supabase.co";
const SUPABASE_PUBLISHABLE_KEY = "sb_publishable_i0xPBsdCEkHpyNSrPlpTDw_Ku6wrXU5";

let products = [];
let categories = ["Todos"];
let selected = "Todos";
let searchTerm = "";

const filtersEl = document.querySelector("#filters");
const catalogEl = document.querySelector("#catalog");

function escapeHTML(value) {
  return String(value ?? "").replace(/[&<>"']/g, char => ({
    "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"
  })[char]);
}

function whatsappLink(product) {
  const transferPrice = product.transferPrice ?? product.transfer_price ?? "";
  const message = encodeURIComponent(
    `Hola 3Estrellas! Quiero consultar por ${product.name}. Precio: ${product.installments} o ${transferPrice} por transferencia. Talle: ${product.size}. ¿Sigue disponible?`
  );
  return `https://wa.me/${WHATSAPP}?text=${message}`;
}

function renderFilters() {
  filtersEl.innerHTML = categories.map(category => `
    <button type="button" class="${category === selected ? "active" : ""}" data-category="${escapeHTML(category)}">${escapeHTML(category)}</button>
  `).join("");
}

function render() {
  const filtered = products.filter(product => {
    const matchesCategory = selected === "Todos" || product.category === selected;
    const haystack = `${product.name} ${product.category} ${product.size}`.toLowerCase();
    return matchesCategory && haystack.includes(searchTerm.toLowerCase());
  });

  catalogEl.innerHTML = filtered.map(product => `
    <article class="product">
      <div class="photo">
        ${product.image ? `<img src="${escapeHTML(product.image)}" alt="${escapeHTML(product.name)}" loading="lazy" onerror="this.parentElement.textContent='Foto no disponible';">` : "FOTO DEL PRODUCTO"}
      </div>
      <div class="info">
        <div class="cat">${escapeHTML(product.category)}</div>
        <div class="name">${escapeHTML(product.name)}</div>
        <div class="price">${escapeHTML(product.installments)}</div>
        <div class="price transfer">${escapeHTML(product.transferPrice ?? product.transfer_price ?? "")} <small>por transferencia</small></div>
        <div class="size">Talle: ${escapeHTML(product.size)}</div>
        <div class="stock ${product.stock ? "" : "unavailable"}">${product.stock ? "● Disponible" : "● Sin stock"}</div>
        ${product.stock ? `<a href="${whatsappLink(product)}" target="_blank" rel="noopener noreferrer"><button class="buy" type="button">Consultar por WhatsApp</button></a>` : ""}
      </div>
    </article>
  `).join("") || '<div class="empty">No hay productos en esta categoría.</div>';
}

filtersEl.addEventListener("click", event => {
  const button = event.target.closest("button[data-category]");
  if (!button) return;
  selected = button.dataset.category;
  renderFilters();
  render();
});

document.querySelector("#search").addEventListener("input", event => {
  searchTerm = event.target.value.trim();
  render();
});

async function loadProductsFromSupabase() {
  try {
    const response = await fetch(`${SUPABASE_URL}/rest/v1/products?select=id,name,category,installments,transfer_price,size,stock,image&order=created_at.asc`, {
      headers: {
        apikey: SUPABASE_PUBLISHABLE_KEY,
        Authorization: `Bearer ${SUPABASE_PUBLISHABLE_KEY}`
      }
    });

    if (!response.ok) throw new Error(`Supabase ${response.status}`);

    const data = await response.json();
    if (!Array.isArray(data)) throw new Error("Respuesta inválida");

    products = data.map(p => ({...p, transferPrice:p.transfer_price ?? ""}));
    categories = ["Todos", ...new Set(products.map(p => p.category).filter(Boolean))];

    renderFilters();
    render();
  } catch (error) {
    console.error("No se pudo cargar el catálogo desde Supabase.", error);
    catalogEl.innerHTML = '<div class="empty">No pudimos cargar los productos. Volvé a intentarlo en unos instantes.</div>';
  }
}

renderFilters();
loadProductsFromSupabase();
</script>

<script src="cart.js" defer></script>
</body>
</html>
