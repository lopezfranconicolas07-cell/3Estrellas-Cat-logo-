.product{background:var(--card);border:1px solid var(--line);border-radius:16px;overflow:hidden}.photo{aspect-ratio:4/5;background:linear-gradient(135deg,#24202a,#0f0d12);display:flex;align-items:center;justify-content:center;color:#716a78;font-size:12px;text-align:center;padding:15px}.photo img{width:100%;height:100%;object-fit:cover}.info{padding:13px}.cat{font-size:10px;text-transform:uppercase;color:#a78bfa;letter-spacing:1px}.name{font-weight:800;margin:5px 0}.price{font-size:17px;font-weight:900}.stock{font-size:11px;color:#86efac;margin:5px 0 11px}.buy{width:100%;border-radius:10px;background:var(--accent);border:0;padding:11px;font-weight:800;color:#fff;cursor:pointer}.empty{grid-column:1/-1;padding:40px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:16px}
.search-wrap{max-width:1100px;margin:0 auto;padding:14px 16px 0}.search-wrap input{width:100%;padding:13px 15px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--text);font:inherit}.transfer{font-size:14px;margin-top:4px}.transfer small{font-size:11px;color:var(--muted);font-weight:400}.size{font-size:12px;color:var(--muted);margin-top:7px}.stock.unavailable{color:#fca5a5}footer{text-align:center;color:var(--muted);font-size:12px;padding:30px 15px;border-top:1px solid var(--line)}

async function loadProductsFromSupabase() {
  try {
    const response = await fetch(`${SUPABASE_URL}/rest/v1/products?select=id,name,category,installments,transfer_price,size,stock,image&order=created_at.asc`, {
      headers: {
        apikey: SUPABASE_PUBLISHABLE_KEY,
        Authorization: `Bearer ${SUPABASE_PUBLISHABLE_KEY}`
      }
    });
    if (!response.ok) throw new Error(`Supabase ${response.status}`);
    const data = await response.json();
    if (!Array.isArray(data)) throw new Error("Respuesta inválida");
    products = data.map(p => ({ ...p, transferPrice: p.transfer_price ?? "" }));
    categories = ["Todos", ...new Set(products.map(p => p.category).filter(Boolean))];
    renderFilters();
    render();
  } catch (error) {
    console.warn("No se pudo cargar Supabase; se usa el catálogo de respaldo.", error);
  }
}

let products = fallbackProducts;
let categories = ["Todos", ...new Set(products.map(p => p.category))];
let selected = "Todos";
let searchTerm = "";

const filtersEl = document.querySelector("#filters");
const catalogEl = document.querySelector("#catalog");

function escapeHTML(value) {
  return String(value ?? "").replace(/[&<>"']/g, char => ({
    "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
  })[char]);
}

function whatsappLink(product) {
  const message = encodeURIComponent(
    `Hola 3Estrellas! Quiero consultar por ${product.name}. ` +
    `Precio: ${product.installments} o ${product.transferPrice} por transferencia. ` +
    `Talle: ${product.size}. ¿Sigue disponible?`
  );
  return `https://wa.me/${WHATSAPP}?text=${message}`;
}

function renderFilters() {
  filtersEl.innerHTML = categories.map(category => `
    <button type="button"
      class="${category === selected ? "active" : ""}"
      data-category="${escapeHTML(category)}">${escapeHTML(category)}</button>
  `).join("");
}

function render() {
  const filtered = products.filter(product => {
    const matchesCategory = selected === "Todos" || product.category === selected;
    const haystack = `${product.name} ${product.category} ${product.size}`.toLowerCase();
    return matchesCategory && haystack.includes(searchTerm.toLowerCase());
  });

  catalogEl.innerHTML = filtered.map(product => `
    <article class="product">
      <div class="photo">
        ${product.image
          ? `<img src="${escapeHTML(product.image)}" alt="${escapeHTML(product.name)}" loading="lazy"
               onerror="this.parentElement.textContent='Foto no disponible';">`
          : "FOTO DEL PRODUCTO"}
      </div>
      <div class="info">
        <div class="cat">${escapeHTML(product.category)}</div>
        <div class="name">${escapeHTML(product.name)}</div>
        <div class="price">${escapeHTML(product.installments)}</div>
        <div class="price transfer">${escapeHTML(product.transferPrice)} <small>por transferencia</small></div>
        <div class="size">Talle: ${escapeHTML(product.size)}</div>
        <div class="stock ${product.stock ? "" : "unavailable"}">
          ${product.stock ? "● Disponible" : "● Sin stock"}
        </div>
        ${product.stock
          ? `<a href="${whatsappLink(product)}" target="_blank" rel="noopener noreferrer">
               <button class="buy" type="button">Consultar por WhatsApp</button>
             </a>`
          : ""}
      </div>
    </article>
  `).join("") || '<div class="empty">No hay productos en esta categoría.</div>';
}

filtersEl.innerHTML = categories.map(category => `
  <button type="button"
    class="${category === selected ? "active" : ""}"
    data-category="${escapeHTML(category)}">${escapeHTML(category)}</button>
`).join("");

filtersEl.addEventListener("click", event => {
  const button = event.target.closest("button[data-category]");
  if (!button) return;
  selected = button.dataset.category;
  renderFilters();
  render();
});

const search = document.querySelector("#search");
search.addEventListener("input", event => {
  searchTerm = event.target.value.trim();
  render();
});

renderFilters();
render();
loadProductsFromSupabase();
</script>
