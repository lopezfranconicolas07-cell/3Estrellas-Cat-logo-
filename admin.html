<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>3Estrellas · Administración</title>
<style>
:root{color-scheme:dark;--bg:#0d0d10;--card:#17171c;--line:#292930;--text:#f5f5f7;--muted:#a3a3ad;--accent:#8b5cf6;--danger:#ef4444}*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:var(--bg);color:var(--text)}.wrap{max-width:1100px;margin:auto;padding:18px}.top{display:flex;justify-content:space-between;gap:12px;align-items:center;margin-bottom:18px}.brand{font-size:22px;font-weight:800}.muted{color:var(--muted);font-size:13px}.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:16px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:12px}label{display:block;font-size:13px;color:var(--muted);margin:0 0 6px}input,select,button,textarea{width:100%;font:inherit}input,select{background:#101014;color:var(--text);border:1px solid var(--line);border-radius:10px;padding:11px}button{border:0;border-radius:10px;padding:11px 14px;background:var(--accent);color:white;font-weight:700;cursor:pointer}button.secondary{background:#292930}button.danger{background:var(--danger)}button:disabled{opacity:.5;cursor:not-allowed}.actions{display:flex;gap:8px}.actions button{width:auto}.hidden{display:none}.status{padding:10px;border-radius:10px;background:#111116;color:var(--muted);margin-bottom:12px}.products{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px}.product{border:1px solid var(--line);border-radius:14px;overflow:hidden;background:#111116}.product img{width:100%;aspect-ratio:1/1;object-fit:cover;background:#202025}.product .body{padding:12px}.price{font-weight:800}.stock{font-size:12px;color:#86efac}.nostock{color:#fca5a5}.login{max-width:430px;margin:10vh auto}.preview{max-width:180px;max-height:180px;border-radius:12px;margin-top:8px;object-fit:cover}.small{font-size:12px}.row{display:flex;gap:8px;align-items:center}.row input{flex:1}.check{width:auto}.empty{padding:30px;text-align:center;color:var(--muted)}
</style></head>
<body>
<div id="loginView" class="wrap login"><div class="card"><div class="brand">★ 3Estrellas</div><p class="muted">Panel privado de administración</p><div id="loginMsg" class="status hidden"></div><label>Email</label><input id="email" type="email" autocomplete="username"><label style="margin-top:10px">Contraseña</label><input id="password" type="password" autocomplete="current-password"><button id="loginBtn" style="margin-top:14px">Ingresar</button><p class="muted small" style="margin-top:12px">Solo usuarios de Supabase con rol admin pueden modificar productos.</p></div></div>
<div id="app" class="wrap hidden">
<div class="top"><div><div class="brand">★ 3Estrellas · Admin</div><div id="userLabel" class="muted"></div></div><div class="actions"><button class="secondary" id="newBtn">+ Nuevo</button><button class="secondary" id="logoutBtn">Salir</button></div></div>
<div id="msg" class="status hidden"></div>
<div id="editor" class="card hidden"><h2 id="formTitle">Nuevo producto</h2><form id="productForm"><input id="id" type="hidden"><div class="grid"><div><label>Nombre</label><input id="name" required></div><div><label>Categoría</label><input id="category" required></div><div><label>3 cuotas</label><input id="installments" placeholder="3 Cuotas de $7,900"></div><div><label>Precio transferencia</label><input id="transfer_price" placeholder="$18,900"></div><div><label>Talle</label><input id="size" placeholder="M / L"></div><div><label>Stock</label><select id="stock"><option value="true">Disponible</option><option value="false">Sin stock</option></select></div></div><div style="margin-top:12px"><label>Foto del producto</label><input id="imageFile" type="file" accept="image/*"><img id="preview" class="preview hidden"><div id="currentImage" class="muted small" style="margin-top:6px"></div></div><div class="actions" style="margin-top:14px"><button type="submit" id="saveBtn">Guardar producto</button><button type="button" class="secondary" id="cancelBtn">Cancelar</button></div></form></div>
<div class="card"><div class="row"><h2 style="margin:0">Productos</h2><span id="count" class="muted"></span></div><div id="products" class="products" style="margin-top:14px"></div></div>
</div>
<script>
const SUPABASE_URL='https://pwiakszymoicfqxvkchm.supabase.co';
const SUPABASE_KEY='sb_publishable_i0xPBsdCEkHpyNSrPlpTDw_Ku6wrXU5';
let token=null, products=[];
const $=id=>document.getElementById(id);
function headers(extra={}){return {'apikey':SUPABASE_KEY,'Authorization':'Bearer '+token,...extra}}
function show(el,on=true){el.classList.toggle('hidden',!on)}
function message(t,error=false){$('msg').textContent=t;$('msg').style.color=error?'#fca5a5':'#a3a3ad';show($('msg'),true);setTimeout(()=>show($('msg'),false),4500)}
function loginMessage(t){$('loginMsg').textContent=t;show($('loginMsg'),true)}
async function api(path,opts={}){const r=await fetch(SUPABASE_URL+path,{...opts,headers:headers(opts.headers||{})});const text=await r.text();let data;try{data=text?JSON.parse(text):null}catch{data=text}if(!r.ok)throw new Error(data?.message||data?.error_description||data?.hint||text||r.status);return data}
async function login(){const email=$('email').value.trim(),password=$('password').value;if(!email||!password)return loginMessage('Completá email y contraseña.');$('loginBtn').disabled=true;try{const r=await fetch(SUPABASE_URL+'/auth/v1/token?grant_type=password',{method:'POST',headers:{'apikey':SUPABASE_KEY,'Content-Type':'application/json'},body:JSON.stringify({email,password})});const d=await r.json();if(!r.ok)throw new Error(d.msg||d.error_description||'No se pudo iniciar sesión.');token=d.access_token;const user=await api('/auth/v1/user');if(user.app_metadata?.role!=='admin'){token=null;throw new Error('Tu usuario no tiene rol admin.');}sessionStorage.setItem('sb_admin_token',token);$('userLabel').textContent=user.email;show($('loginView'),false);show($('app'),true);await loadProducts()}catch(e){loginMessage(e.message)}finally{$('loginBtn').disabled=false}}
async function restore(){const t=sessionStorage.getItem('sb_admin_token');if(!t)return;token=t;try{const user=await api('/auth/v1/user');if(user.app_metadata?.role!=='admin')throw new Error();$('userLabel').textContent=user.email;show($('loginView'),false);show($('app'),true);await loadProducts()}catch{sessionStorage.removeItem('sb_admin_token');token=null}}
async function loadProducts(){products=await api('/rest/v1/products?select=id,name,category,installments,transfer_price,size,stock,image&order=created_at.asc');render()}
function render(){ $('count').textContent=products.length+' productos';const root=$('products');if(!products.length){root.innerHTML='<div class="empty">No hay productos.</div>';return}root.innerHTML=products.map(p=>`<article class="product"><img src="${esc(p.image||'')}" alt="${esc(p.name)}" onerror="this.style.display='none'"><div class="body"><strong>${esc(p.name)}</strong><div class="muted">${esc(p.category)} · ${esc(p.size||'Sin talle')}</div><div class="price" style="margin-top:6px">${esc(p.transfer_price||'Sin precio')}</div><div class="small ${p.stock?'stock':'nostock'}">${p.stock?'● Disponible':'● Sin stock'}</div><div class="actions" style="margin-top:10px"><button onclick="editProduct('${p.id}')">Editar</button><button class="danger" onclick="deleteProduct('${p.id}')">Eliminar</button></div></div></article>`).join('')}
function esc(v){return String(v??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]))}
function openNew(){ $('formTitle').textContent='Nuevo producto';$('productForm').reset();$('id').value='';$('stock').value='true';$('currentImage').textContent='';$('currentImage').dataset.url='';$('preview').removeAttribute('src');show($('preview'),false);show($('editor'),true);scrollTo({top:0,behavior:'smooth'}) }
window.editProduct=id=>{const p=products.find(x=>String(x.id)===String(id));if(!p)return;$('formTitle').textContent='Editar producto';$('id').value=p.id;$('name').value=p.name;$('category').value=p.category;$('installments').value=p.installments||'';$('transfer_price').value=p.transfer_price||'';$('size').value=p.size||'';$('stock').value=String(p.stock);$('imageFile').value='';$('currentImage').textContent=p.image?'Foto actual cargada.':'';$('currentImage').dataset.url=p.image||'';$('preview').src=p.image||'';show($('preview'),!!p.image);show($('editor'),true);scrollTo({top:0,behavior:'smooth'})}
async function uploadImage(file){const ext=(file.name.split('.').pop()||'jpg').toLowerCase().replace(/[^a-z0-9]/g,'');const path=Date.now()+'-'+Math.random().toString(36).slice(2)+'.'+ext;const r=await fetch(SUPABASE_URL+'/storage/v1/object/product-images/'+path,{method:'POST',headers:headers({'Content-Type':file.type||'image/jpeg','x-upsert':'true'}),body:file});if(!r.ok){const t=await r.text();throw new Error('No se pudo subir la foto: '+t)}return SUPABASE_URL+'/storage/v1/object/public/product-images/'+path}
async function save(e){e.preventDefault();$('saveBtn').disabled=true;try{let id=$('id').value;let image=$('currentImage').dataset.url||null;const file=$('imageFile').files[0];if(file)image=await uploadImage(file);const body={name:$('name').value.trim(),category:$('category').value.trim(),installments:$('installments').value.trim()||null,transfer_price:$('transfer_price').value.trim()||null,size:$('size').value.trim()||null,stock:$('stock').value==='true',image};if(id){await api('/rest/v1/products?id=eq.'+encodeURIComponent(id),{method:'PATCH',headers:{'Content-Type':'application/json','Prefer':'return=minimal'},body:JSON.stringify(body)})}else{body.id=Date.now();await api('/rest/v1/products',{method:'POST',headers:{'Content-Type':'application/json','Prefer':'return=minimal'},body:JSON.stringify(body)})}show($('editor'),false);await loadProducts();message('Producto guardado correctamente.')}catch(e){message(e.message,true)}finally{$('saveBtn').disabled=false}}
window.deleteProduct=async id=>{const p=products.find(x=>String(x.id)===String(id));if(!p||!confirm('¿Eliminar “'+p.name+'”? Esta acción no se puede deshacer.'))return;try{await api('/rest/v1/products?id=eq.'+encodeURIComponent(id),{method:'DELETE'});await loadProducts();message('Producto eliminado.')}catch(e){message(e.message,true)}}
$('loginBtn').onclick=login;$('password').addEventListener('keydown',e=>{if(e.key==='Enter')login()});$('logoutBtn').onclick=()=>{sessionStorage.removeItem('sb_admin_token');token=null;location.reload()};$('newBtn').onclick=openNew;$('cancelBtn').onclick=()=>show($('editor'),false);$('productForm').onsubmit=save;$('imageFile').onchange=()=>{const f=$('imageFile').files[0];if(f){$('preview').src=URL.createObjectURL(f);show($('preview'),true)}};restore();
</script></body></html>
